# Application
spring.application.name=mim-sin-fashion
server.port=${SERVER_PORT:8080}

# PostgreSQL (local defaults; override through environment variables when needed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mimsin_fashion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Development schema management: Hibernate updates tables from JPA entities.
# No Flyway or Liquibase is used.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security
app.security.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Super Admin Bootstrap
app.bootstrap.super-admin.enabled=${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.first-name=${SUPER_ADMIN_FIRST_NAME:Super}
app.bootstrap.super-admin.last-name=${SUPER_ADMIN_LAST_NAME:Admin}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.media.storage-directory=${MEDIA_STORAGE_DIRECTORY:uploads/media}
